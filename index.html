<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Аист-скакун</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; touch-action: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- КОНСТАНТЫ ---
    const GROUND_H = 60;
    const GRASS_DEPTH = 25;
    const GRAVITY = 1;
    const JUMP_SPEED = -21;
    const PLAYER_HITBOX_SHRINK_X = 45;
    const PLAYER_HITBOX_SHRINK_Y = 40;
    const PLAYER_DRAW_OFFSET_Y = 25;
    const OBSTACLE_DRAW_OFFSET_Y = 15;
    const RUN_FRAME_TICKS = 6;
    const START_FRAME_TICKS = 12;
    const GAP_GROWTH = 1.15; // сила облегчения с ростом скорости (1 = как было, выше = легче)

    // Размеры канваса динамические: подстраиваются под экран
    let WIDTH = 800, HEIGHT = 600;
    let STAND_Y = HEIGHT - GROUND_H + GRASS_DEPTH;

    const STATE_MENU = 'menu', STATE_PLAYING = 'playing', STATE_GAMEOVER = 'gameover';
    const STATE_PAUSED = 'paused', STATE_CHECKPOINT = 'checkpoint';
    let gameState = STATE_MENU;

    // --- ЗАГРУЗКА КАРТИНОК (с заглушкой) ---
    function loadSprite(path, w, h, fallbackColor) {
      const spr = { img: null, w, h, color: fallbackColor };
      const image = new Image();
      image.onload = () => { spr.img = image; };
      image.onerror = () => { console.log('Нет файла ' + path + ' — цветная заглушка.'); };
      image.src = path;
      return spr;
    }
    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // --- СПРАЙТЫ ---
    const bgImg       = loadSprite('background.png', WIDTH, HEIGHT, '#87ceeb');
    const bg2Img      = loadSprite('bg2.png', WIDTH, HEIGHT, null);
    const groundImg   = loadSprite('ground.png', WIDTH, GROUND_H, '#228b22');
    const obstacleImg = loadSprite('obstacle.png', 60, 90, '#c83232');
    const playerImg   = loadSprite('player.png', 100, 100, '#0064ff');

    const obstacleVariants = [];
    for (let i = 1; i <= 5; i++) obstacleVariants.push(loadSprite('obstacle' + i + '.png', 60, 90, null));

    const runFrames = [];
    for (let i = 1; i <= 4; i++) runFrames.push(loadSprite('run' + i + '.png', 100, 100, null));

    const jumpUpImg   = loadSprite('jump1.png', 100, 100, null);
    const jumpDownImg = loadSprite('jump2.png', 100, 100, null);

    const startFrames = [];
    for (let i = 1; i <= 3; i++) startFrames.push(loadSprite('start_frame' + i + '.png', WIDTH, HEIGHT, null));

    // Заставка чекпоинта: три кадра, анимация как у стартовой заставки
    const bonusFrames = [];
    for (let i = 1; i <= 3; i++) bonusFrames.push(loadSprite('bonus_frame' + i + '.png', WIDTH, HEIGHT, null));

    const angryImg = loadSprite('angry.png', 140, 140, null);
    const playerStartFrames = [];
    for (let i = 1; i <= 3; i++) playerStartFrames.push(loadSprite('player_start' + i + '.png', 100, 100, null));

    // --- ЗВУКИ ---
    const jumpSound = new Audio('jump.wav'); jumpSound.volume = 0.6;
    const hitSound  = new Audio('hit.wav');  hitSound.volume  = 0.7;
    const bonusSound = new Audio('bonus.wav'); bonusSound.volume = 0.7;
    const music     = new Audio('music.ogg'); music.volume = 0.4; music.loop = true;
    let musicStarted = false;
    function tryPlay(sound) { sound.play().catch(() => {}); }

    // --- ОБЛАКА (параллакс) ---
    function makeCloud(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(255,255,255,0.78)';
      g.beginPath(); g.ellipse(w / 2, h * 2 / 3, w / 2, h / 3, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(w * 0.35, h * 0.5, w / 5, h / 2, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(w * 0.75, h * 0.6, w / 4, h * 0.4, 0, 0, Math.PI * 2); g.fill();
      return c;
    }

    const clouds = [];
    for (let i = 0; i < 7; i++) {
      const w = randomInt(90, 180), h = randomInt(30, 55);
      clouds.push({ surf: makeCloud(w, h), x: randomInt(-100, WIDTH), y: randomInt(30, HEIGHT / 2), speed: 0.15 + Math.random() * 0.3 });
    }

    // --- СОСТОЯНИЕ ---
    const player = { x: 150, bottom: STAND_Y, w: 125, h: 125, velocityY: 0, onGround: true };
    let worldSpeed = 6, worldX = 0, nextObstacleX = 600;
    let obstacles = [];
    let score = 0, lastScore = 0, bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('aist_best') || '0', 10); } catch (e) {}

    let tick = 0, frameIndex = 0;
    let nextCheckpoint = 100; // следующая отметка чекпоинта

    // Множитель очков: каждые +2 к скорости мира — ×2, потолок ×8
    function scoreMultiplier() {
      const stage = Math.floor((worldSpeed - 6) / 2);
      return Math.min(8, Math.pow(2, stage));
    }

    // --- КНОПКИ ПАУЗЫ ---
    const pauseButtons = {
      resume: { x: WIDTH / 2 - 140, y: 320, w: 280, h: 65, text: 'ПРОДОЛЖИТЬ', font: 32 },
      menu:   { x: WIDTH / 2 - 140, y: 410, w: 280, h: 65, text: 'НА ГЛАВНЫЙ ЭКРАН', font: 22 }
    };

    // --- КНОПКИ ЭКРАНА «КОНЕЦ ИГРЫ» ---
    const gameoverButtons = {
      menu: { x: WIDTH / 2 - 140, y: HEIGHT / 2 + 130, w: 280, h: 65, text: 'В ГЛАВНОЕ МЕНЮ', font: 22 }
    };

    // --- ДИНАМИЧЕСКИЙ РАЗМЕР ЭКРАНА ---
    // В горизонтали канвас становится шире (высота 600, ширина — по пропорциям экрана),
    // в вертикали остаётся 4:3, как раньше. Игра всегда заполняет экран целиком.
    function resizeCanvas() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const aspect = vw / vh;

      if (aspect >= 1) {
        HEIGHT = 600;
        WIDTH = Math.max(800, Math.min(1920, Math.round(600 * aspect)));
      } else {
        WIDTH = 800;
        HEIGHT = 600;
      }

      canvas.width = WIDTH;
      canvas.height = HEIGHT;
      STAND_Y = HEIGHT - GROUND_H + GRASS_DEPTH;

      // Пересчёт того, что зависит от размеров
      if (player.onGround) player.bottom = STAND_Y;
      for (const obs of obstacles) obs.y = STAND_Y - obs.h;
      for (const c of clouds) { c.x = randomInt(-100, WIDTH); c.y = randomInt(30, HEIGHT / 2); }
      pauseBtn.x = WIDTH - 70;

      // Кнопки паузы и экрана поражения — всегда по центру текущего канваса
      pauseButtons.resume.x = WIDTH / 2 - 140;
      pauseButtons.menu.x   = WIDTH / 2 - 140;
      pauseButtons.resume.y = HEIGHT / 2 + 20;
      pauseButtons.menu.y   = HEIGHT / 2 + 110;
      gameoverButtons.menu.x = WIDTH / 2 - 140;
      gameoverButtons.menu.y = HEIGHT / 2 + 130;

      // CSS-размер: в горизонтали весь экран, в вертикали 4:3 по ширине
      canvas.style.width = vw + 'px';
      canvas.style.height = (aspect >= 1 ? vh : Math.round(vw * 3 / 4)) + 'px';
    }

    function resetGame() {
      obstacles = []; worldSpeed = 6; worldX = 0; nextObstacleX = 600;
      score = 0; player.bottom = STAND_Y; player.velocityY = 0; player.onGround = true;
      frameIndex = 0; nextCheckpoint = 100;
    }

    function startGame() {
      resetGame();
      gameState = STATE_PLAYING;
      if (!musicStarted) { musicStarted = true; tryPlay(music); }
      else tryPlay(music);
    }

    function pauseGame() {
      if (gameState !== STATE_PLAYING) return;
      gameState = STATE_PAUSED;
      music.pause();
    }

    function resumeGame() {
      gameState = STATE_PLAYING;
      tryPlay(music);
    }

    function goMenu() {
      gameState = STATE_MENU;
      music.pause();
    }

    function playerHitbox() {
      return {
        x: player.x + PLAYER_HITBOX_SHRINK_X / 2,
        y: player.bottom - player.h + PLAYER_HITBOX_SHRINK_Y / 2,
        w: player.w - PLAYER_HITBOX_SHRINK_X,
        h: player.h - PLAYER_HITBOX_SHRINK_Y
      };
    }

    // --- ВВОД ---
    function canvasPoint(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) * canvas.width / r.width,
        y: (e.clientY - r.top) * canvas.height / r.height
      };
    }
    function inRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

    function doJump() {
      if (player.onGround) {
        player.velocityY = JUMP_SPEED;
        player.onGround = false;
        tryPlay(jumpSound);
      }
    }

    // Кнопка паузы в углу экрана (для телефона)
    const pauseBtn = { x: WIDTH - 70, y: 15, w: 55, h: 45 };

    canvas.addEventListener('pointerdown', e => {
      const p = canvasPoint(e);
      if (gameState === STATE_MENU) startGame();
      else if (gameState === STATE_PLAYING) {
        if (inRect(p, pauseBtn)) pauseGame();
        else doJump();
      }
      else if (gameState === STATE_PAUSED) {
        if (inRect(p, pauseButtons.resume)) resumeGame();
        else if (inRect(p, pauseButtons.menu)) goMenu();
      }
      else if (gameState === STATE_CHECKPOINT) resumeGame();
      else if (gameState === STATE_GAMEOVER) {
        if (inRect(p, gameoverButtons.menu)) goMenu();
        else startGame();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (gameState === STATE_PLAYING) pauseGame();
        else if (gameState === STATE_PAUSED) resumeGame();
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === STATE_MENU || gameState === STATE_GAMEOVER) startGame();
        else if (gameState === STATE_PLAYING) doJump();
        else if (gameState === STATE_PAUSED) resumeGame();
        else if (gameState === STATE_CHECKPOINT) resumeGame();
      }
    });

    // --- ВЫБОР СПРАЙТА ПРЕПЯТСТВИЯ ---
    function getObstacleSprite() {
      const loaded = obstacleVariants.filter(s => s.img);
      return loaded.length ? loaded[randomInt(0, loaded.length - 1)] : obstacleImg;
    }

    // Фон «с заполнением»: растягивается пропорционально, лишнее обрезается
    function drawCover(img) {
      if (!img) return;
      const scale = Math.max(WIDTH / img.width, HEIGHT / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (WIDTH - w) / 2, (HEIGHT - h) / 2, w, h);
    }

    // --- ОБНОВЛЕНИЕ ---
    function update() {
      tick++;

      // Пауза и чекпоинт: мир заморожен полностью
      if (gameState === STATE_PAUSED || gameState === STATE_CHECKPOINT) return;

      if (gameState !== STATE_PLAYING) {
        for (const c of clouds) {
          c.x -= 0.5 * c.speed;
          if (c.surf.width + c.x < -20) { c.x = WIDTH + randomInt(0, 200); c.y = randomInt(30, HEIGHT / 2); }
        }
        return;
      }

      worldX += worldSpeed;

      for (const c of clouds) {
        c.x -= worldSpeed * c.speed;
        if (c.surf.width + c.x < -20) { c.x = WIDTH + randomInt(0, 200); c.y = randomInt(30, HEIGHT / 2); }
      }

      // Препятствия летят и медленно вращаются
      for (const obs of obstacles) { obs.x -= worldSpeed; obs.rot += obs.rotSpeed; }

      if (worldX + WIDTH > nextObstacleX) {
        const w = randomInt(44, 77), h = randomInt(55, 99);
        obstacles.push({
          x: WIDTH + 50, y: STAND_Y - h, w, h, passed: false, spr: getObstacleSprite(),
          rot: 0,
          rotSpeed: (Math.random() * 0.04 + 0.015) * (Math.random() < 0.5 ? -1 : 1)
        });
        // Промежуток растёт медленнее скорости — сложнее, чем с 1.3, легче, чем без роста
        nextObstacleX += randomInt(350, 650) * Math.pow(worldSpeed / 6, GAP_GROWTH);
      }
      obstacles = obstacles.filter(o => o.x + o.w > -50);

      player.velocityY += GRAVITY;
      player.bottom += player.velocityY;
      if (player.bottom >= STAND_Y) { player.bottom = STAND_Y; player.velocityY = 0; player.onGround = true; }

      if (tick % RUN_FRAME_TICKS === 0) {
        const loaded = runFrames.filter(s => s.img);
        if (loaded.length) frameIndex = (frameIndex + 1) % loaded.length;
      }

      const hitbox = playerHitbox();
      for (const obs of obstacles) {
        if (!obs.passed && obs.x + obs.w < player.x) {
          obs.passed = true;
          score += scoreMultiplier();
          // Чекпоинт каждые 100 очков
          if (score >= nextCheckpoint) {
            nextCheckpoint += 100;
            gameState = STATE_CHECKPOINT;
            tryPlay(bonusSound);
            break;
          }
        }
        const obsHitbox = { x: obs.x + 7, y: obs.y + 9, w: obs.w - 14, h: obs.h - 18 };
        const collide =
          hitbox.x < obsHitbox.x + obsHitbox.w && hitbox.x + hitbox.w > obsHitbox.x &&
          hitbox.y < obsHitbox.y + obsHitbox.h && hitbox.y + hitbox.h > obsHitbox.y;
        if (collide) {
          gameState = STATE_GAMEOVER;
          lastScore = score;
          if (score > bestScore) {
            bestScore = score;
            try { localStorage.setItem('aist_best', String(bestScore)); } catch (e) {}
          }
          tryPlay(hitSound);
          break;
        }
      }

      worldSpeed += 0.002;
    }

    // --- ОТРИСОВКА ---
    function drawSprite(spr, x, y, w, h) {
      if (spr && spr.img) ctx.drawImage(spr.img, x, y, w, h);
      else if (spr) { ctx.fillStyle = spr.color || '#888'; ctx.fillRect(x, y, w, h); }
    }

    function getPlayerSprite() {
      if (gameState === STATE_MENU) {
        const loaded = playerStartFrames.filter(s => s.img);
        if (loaded.length) return loaded[Math.floor(tick / START_FRAME_TICKS) % loaded.length];
        return playerImg;
      }
      if (gameState === STATE_PLAYING && !player.onGround) {
        if (player.velocityY < 0 && jumpUpImg.img) return jumpUpImg;
        if (player.velocityY >= 0 && jumpDownImg.img) return jumpDownImg;
        return playerImg;
      }
      const loaded = runFrames.filter(s => s.img);
      if (loaded.length) return loaded[frameIndex % loaded.length];
      return playerImg;
    }

    function drawRoundButton(x, y, w, h, text, fontSize) {
      ctx.fillStyle = '#e8a13a';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 15);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = 'bold ' + (fontSize || 32) + 'px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
    }

    function drawMenu() {
      const loadedStart = startFrames.filter(s => s.img);
      if (loadedStart.length) {
        const frameIdx = Math.floor(tick / START_FRAME_TICKS) % loadedStart.length;
        drawCover(loadedStart[frameIdx].img);
      } else {
        ctx.fillStyle = '#1e5f8a';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      for (const c of clouds) ctx.drawImage(c.surf, c.x, c.y);

      drawRoundButton(WIDTH / 2 - 120, HEIGHT / 2 + 20, 240, 70, 'ИГРАТЬ');

      ctx.textAlign = 'center';
      ctx.font = '24px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Рекорд: ' + bestScore, WIDTH / 2, HEIGHT / 2 + 140);
      ctx.font = '20px Arial';
      ctx.fillStyle = '#cccccc';
      ctx.fillText('Тапни или нажми пробел', WIDTH / 2, HEIGHT / 2 + 175);
      ctx.textAlign = 'left';
    }

    function drawPause() {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.textAlign = 'center';
      ctx.font = 'bold 56px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('ПАУЗА', WIDTH / 2, HEIGHT / 2 - 90);
      ctx.textAlign = 'left';

      drawRoundButton(pauseButtons.resume.x, pauseButtons.resume.y, pauseButtons.resume.w, pauseButtons.resume.h, pauseButtons.resume.text, pauseButtons.resume.font);
      drawRoundButton(pauseButtons.menu.x, pauseButtons.menu.y, pauseButtons.menu.w, pauseButtons.menu.h, pauseButtons.menu.text, pauseButtons.menu.font);
    }

    function drawCheckpoint() {
      // Анимированная заставка из трёх кадров, как на старте
      const loadedBonus = bonusFrames.filter(s => s.img);
      if (loadedBonus.length) {
        const frameIdx = Math.floor(tick / START_FRAME_TICKS) % loadedBonus.length;
        drawCover(loadedBonus[frameIdx].img);
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      ctx.textAlign = 'center';
      ctx.font = 'bold 48px Arial';
      ctx.fillStyle = '#ffd75e';
      ctx.fillText('УРА! ' + (nextCheckpoint - 100) + ' ОЧКОВ!', WIDTH / 2, HEIGHT / 2 + 150);

      ctx.font = '24px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Коснитесь экрана — продолжить', WIDTH / 2, HEIGHT / 2 + 200);
      ctx.textAlign = 'left';
    }

    function draw() {
      if (gameState === STATE_MENU) { drawMenu(); return; }

      if (bgImg.img) drawCover(bgImg.img);
      else { ctx.fillStyle = bgImg.color; ctx.fillRect(0, 0, WIDTH, HEIGHT); }

      if (bg2Img.img) {
        // Дальний план: две плитки со «сжатием» под пропорции экрана
        const scale = Math.max(WIDTH / bg2Img.img.width, HEIGHT / bg2Img.img.height);
        const tw = bg2Img.img.width * scale, th = bg2Img.img.height * scale;
        const off = -(worldX * 0.3 % tw);
        ctx.drawImage(bg2Img.img, off, (HEIGHT - th) / 2, tw, th);
        ctx.drawImage(bg2Img.img, off + tw, (HEIGHT - th) / 2, tw, th);
      }

      for (const c of clouds) ctx.drawImage(c.surf, c.x, c.y);

      // Трава кладётся плитками в её родной пропорции, без растягивания
      if (groundImg.img) {
        const tw = groundImg.img.width * (GROUND_H / groundImg.img.height);
        const groundOffset = -(worldX % tw);
        for (let gx = groundOffset; gx < WIDTH; gx += tw) {
          ctx.drawImage(groundImg.img, gx, HEIGHT - GROUND_H, tw, GROUND_H);
        }
      } else {
        drawSprite(groundImg, 0, HEIGHT - GROUND_H, WIDTH, GROUND_H);
      }

      // Препятствия рисуются с вращением вокруг своего центра
      for (const obs of obstacles) {
        ctx.save();
        ctx.translate(obs.x + obs.w / 2, obs.y + OBSTACLE_DRAW_OFFSET_Y + obs.h / 2);
        ctx.rotate(obs.rot);
        drawSprite(obs.spr, -obs.w / 2, -obs.h / 2, obs.w, obs.h);
        ctx.restore();
      }

      drawSprite(getPlayerSprite(), player.x, player.bottom - player.h + PLAYER_DRAW_OFFSET_Y, player.w, player.h);

      // Кнопка паузы (видна во время игры)
      if (gameState === STATE_PLAYING) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.roundRect(pauseBtn.x, pauseBtn.y, pauseBtn.w, pauseBtn.h, 10);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pauseBtn.x + 16, pauseBtn.y + 12, 7, 21);
        ctx.fillRect(pauseBtn.x + 30, pauseBtn.y + 12, 7, 21);
      }

      ctx.font = '28px Arial';
      ctx.fillStyle = '#ffffff';
      const scoreText = 'Очки: ' + score;
      ctx.fillText(scoreText, 20, 40);

      // Индикатор множителя — сразу после цифр счёта
      const mult = scoreMultiplier();
      if (mult > 1) {
        const scoreWidth = ctx.measureText(scoreText).width;
        ctx.fillStyle = '#ffd75e';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('×' + mult, 20 + scoreWidth + 15, 40);
        ctx.font = '28px Arial';
        ctx.fillStyle = '#ffffff';
      }

      if (gameState === STATE_PAUSED) drawPause();
      else if (gameState === STATE_CHECKPOINT) drawCheckpoint();
      else if (gameState === STATE_GAMEOVER) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const angryBob = Math.sin(tick * 0.08) * 6;
        drawSprite(angryImg, WIDTH / 2 - 70, HEIGHT / 2 - 230 + angryBob, 140, 140);

        ctx.textAlign = 'center';
        ctx.font = 'bold 52px Arial';
        ctx.fillStyle = '#e74c3c';
        ctx.fillText('КОНЕЦ ИГРЫ', WIDTH / 2, HEIGHT / 2 - 70);

        ctx.font = '36px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Ваш счёт: ' + lastScore, WIDTH / 2, HEIGHT / 2 - 10);

        ctx.font = '28px Arial';
        ctx.fillStyle = '#ffd75e';
        ctx.fillText('Рекорд: ' + bestScore, WIDTH / 2, HEIGHT / 2 + 35);

        ctx.font = '24px Arial';
        ctx.fillStyle = '#cccccc';
        ctx.fillText('Коснитесь экрана — заново', WIDTH / 2, HEIGHT / 2 + 85);
        ctx.textAlign = 'left';

        drawRoundButton(gameoverButtons.menu.x, gameoverButtons.menu.y, gameoverButtons.menu.w, gameoverButtons.menu.h, gameoverButtons.menu.text, gameoverButtons.menu.font);
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
